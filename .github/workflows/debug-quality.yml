name: Debug quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install compile SDK
        run: sdkmanager "platforms;android-37"
      - name: Create disposable Firebase client configuration
        shell: python
        run: |
          import json
          from pathlib import Path
          config = {
              "project_info": {"project_number": "123456789012", "project_id": "smartergarage-ci-only"},
              "client": [{
                  "client_info": {
                      "mobilesdk_app_id": "1:123456789012:android:0123456789abcdef012345",
                      "android_client_info": {"package_name": "com.lusion.sgauto"}
                  },
                  "api_key": [{"current_key": "CI_NOT_A_REAL_FIREBASE_API_KEY"}]
              }],
              "configuration_version": "1"
          }
          Path("mobile/google-services.json").write_text(json.dumps(config))
      - name: Debug compile, JVM tests, and lint
        run: bash ./gradlew :mobile:compileDebugKotlin :mobile:testDebugUnitTest :mobile:lintDebug --console=plain
